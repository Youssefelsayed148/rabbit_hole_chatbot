# Standalone offline compatibility stack. The default docker-compose.yml now also
# supports offline development, tests and the real profile.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rh
      POSTGRES_PASSWORD: rh
      POSTGRES_DB: rh_dev
    ports: ['127.0.0.1:55439:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rh -d rh_dev']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: {context: ., target: service}
    command: ['python', '-m', 'scripts.dev']
    environment:
      ENV: development
      DATABASE_URL: postgresql://rh:rh@db:5432/rh_dev
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      SITE_KEYS: pk_demo
      ADMIN_TOKEN: dev-ingest-only
      CATALOGUE_ENABLED: 'false'
      INCLUDE_UNREVIEWED: 'false'
      AUTO_INGEST: 'true'
      RATE_LIMIT_PER_MIN: '100'
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:8000:8000']
