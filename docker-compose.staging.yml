# Optional container deployment template, independent of the chosen host.
# Run only after choosing hosting and filling .env.production; not deployed by Codex.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: rh
    volumes: [staging_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rh -d rh"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env.production
    environment:
      ENV: production
      DATABASE_URL: postgresql://rh:${POSTGRES_PASSWORD}@db:5432/rh
      CATALOGUE_ENABLED: "false"
      INCLUDE_UNREVIEWED: "false"
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
volumes:
  staging_pgdata:
